[package]
name = "cardano-census"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "One-shot reachability census of the Cardano big ledger peers, emitted as node exporter textfile metrics"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hex = "0.4"
pallas-network = "1.4"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
